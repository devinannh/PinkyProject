# Builds "PDF Form Reader.exe" on a GitHub Windows machine.
#
# Runs on every push to any branch that changes the reader, and can be started
# by hand (Actions tab > Build Windows app > Run workflow). The finished .exe
# is attached to the run under "Artifacts" for 90 days.
#
# No job data is involved: the tests and the self-check use made-up forms.
name: Build Windows app

on:
  push:
    paths:
      - "*.py"
      - "requirements*.txt"
      - "tests/**"
      - ".github/workflows/build-windows-exe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -r requirements-dev.txt pyinstaller==6.11.1

      - name: Tests (including the window)
        run: python -m unittest discover -s tests -v

      - name: Build the .exe
        run: >
          pyinstaller --onefile --windowed --clean --noconfirm
          --name "PDF Form Reader"
          pdf_form_reader_app.py

      - name: Check the built .exe starts and reads a PDF
        shell: pwsh
        timeout-minutes: 3
        run: |
          $p = Start-Process -FilePath "dist\PDF Form Reader.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "The built app failed its self-check (exit code $($p.ExitCode))." }
          Write-Host "Self-check passed."

      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Form-Reader-for-Windows
          path: dist/PDF Form Reader.exe
          retention-days: 90
          if-no-files-found: error
