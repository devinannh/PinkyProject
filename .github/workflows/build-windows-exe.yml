# Builds "Pinky.exe" (Pinky - Form Reader) on a GitHub Windows machine.
#
# Runs on every push to any branch that changes the reader, and can be started
# by hand (Actions tab > Build Windows app > Run workflow). The finished .exe
# is attached to the run under "Artifacts" for 90 days.
#
# No job data is involved: the tests and the self-check use made-up forms.
name: Build Windows app

on:
  push:
    paths:
      - "*.py"
      - "ui/**"
      - "requirements*.txt"
      - "tests/**"
      - ".github/workflows/build-windows-exe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -r requirements-dev.txt pyinstaller==6.11.1

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Build the .exe
        run: >
          pyinstaller --onefile --windowed --clean --noconfirm
          --name "Pinky"
          --add-data "ui;ui"
          --exclude-module tkinter
          pdf_form_reader_app.py

      # The window itself cannot open on a build machine (no desktop), so the
      # self-check proves the rest: the page is inside the .exe, the window
      # library loads, and a run started the way the page starts one reads a PDF.
      - name: Check the built .exe carries its page and reads a PDF
        shell: pwsh
        timeout-minutes: 3
        run: |
          $p = Start-Process -FilePath "dist\Pinky.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Get-Content "$env:TEMP\pinky-selftest.txt" -ErrorAction SilentlyContinue
            throw "The built app failed its self-check (exit code $($p.ExitCode))."
          }
          Write-Host "Self-check passed."

      - uses: actions/upload-artifact@v4
        with:
          name: Pinky-for-Windows
          path: dist/Pinky.exe
          retention-days: 90
          if-no-files-found: error
